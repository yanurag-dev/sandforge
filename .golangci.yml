version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt         # Confirms standard Go formatting compliance
    - goimports     # Verifies imports are formatted and sorted correctly
  settings:
    goimports:
      local-prefixes:
        - github.com/sandforge/sandforge

linters:
  default: none
  enable:
    - errcheck      # Checks that returned errors are handled
    - govet         # Standard compiler static analysis
    - ineffassign   # Detects ineffectual variable assignments
    - staticcheck   # Advanced static analyzer (comprehensive bug checks)
    - unused        # Finds unused constants, variables, functions, and types
    - revive        # Modern style linter (replaces deprecated golint)
    - gosec         # Security auditor for Go source code
    - misspell      # Detects commonly misspelled English words in comments
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # Field alignment warnings are minor and often irrelevant for simple config structs
        - shadow         # Disable strict variable shadowing warnings to avoid verbose error renamings
    revive:
      rules:
        - name: exported
          disabled: true # Disable exported documentation checks for fast development pace
        - name: package-comments
          disabled: true # Pre-existing; package docs are not required at this stage
        - name: unused-parameter
          disabled: true # Pre-existing; unused params are common in interface implementations
        - name: var-naming
          disabled: true # Allow VZBackend and similar names that follow Go conventions
    gosec:
      excludes:
        - G104 # Already caught by errcheck
        - G304 # Already handled securely by our policy engine symlink checks

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
