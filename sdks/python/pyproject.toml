[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sandforge-sdk"
version = "0.1.1"
description = "Python SDK for Sandforge hypervisor sandbox platform"
authors = [{ name = "Anurag Yadav", email = "yadavanurag1310@gmail.com" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.33.0",
]

[project.optional-dependencies]
pty = [
    "websocket-client>=1.0",
]
dev = [
    "websocket-client>=1.0",
    "pytest>=6.0",
    "pytest-cov>=2.10",
    "black>=21.0",
    "mypy>=0.910",
    "flake8>=3.9",
]

[project.urls]
Homepage = "https://github.com/yanurag-dev/sandforge"
Repository = "https://github.com/yanurag-dev/sandforge"
