[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sandforge-sdk"
version = "0.1.0"
description = "Python SDK for Sandforge hypervisor sandbox platform"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.33.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.10",
    "black>=21.0",
    "mypy>=0.910",
    "flake8>=3.9",
]

[project.urls]
Homepage = "https://github.com/yanurag-dev/sandforge"
Repository = "https://github.com/yanurag-dev/sandforge"
